<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReVamp - Rebrand, Revitalize</title>
    <link rel="icon" type="image/png" href="/img/revamplogo.png">
    <link rel="stylesheet" href="/revamp-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Landing Page Specific Styles */
        .landing-page {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Alexandria', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .landing-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        /* Background */
        .landing-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .landing-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .landing-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
        }

        /* Content */
        .landing-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px 80px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Left side - Branding */
        .landing-branding {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .landing-tagline {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 2px;
            margin: 0;
        }

        .landing-logo {
            max-width: 400px;
            height: auto;
        }

        /* Right side - Actions */
        .landing-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: flex-end;
        }

        .btn-guest {
            display: inline-block;
            padding: 16px 36px;
            background: #22c55e;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            min-width: 280px;
            text-align: center;
        }

        .btn-guest:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .btn-admin-login {
            display: inline-block;
            padding: 16px 36px;
            background: transparent;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 280px;
            text-align: center;
        }

        .btn-admin-login:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        /* Footer credit */
        .landing-credit {
            position: absolute;
            bottom: 30px;
            left: 80px;
            z-index: 1;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .landing-content {
                flex-direction: column;
                justify-content: center;
                gap: 60px;
                padding: 40px 30px;
                text-align: center;
            }

            .landing-branding {
                align-items: center;
            }

            .landing-logo {
                max-width: 300px;
            }

            .landing-actions {
                align-items: center;
            }

            .landing-credit {
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
        }
    </style>
</head>
<body class="landing-page">
    <div class="landing-container">
        <!-- Background Image -->
        <div class="landing-bg">
            <img src="/img/hero-bg.jpg" alt="Store Background" onerror="this.style.display='none'">
            <div class="landing-overlay"></div>
        </div>

        <!-- Main Content -->
        <div class="landing-content">
            <!-- Left: Branding -->
            <div class="landing-branding">
                <p class="landing-tagline">REBRAND, REVITALIZE,</p>
                <img src="/img/revamp-white.png" alt="ReVamp" class="landing-logo">
            </div>

            <!-- Right: Action Buttons -->
            <div class="landing-actions">
                <a href="/public.html" class="btn-guest">Continue as Guest</a>
                <a href="/login?returnTo=/admin" class="btn-admin-login">Login as Administrator</a>
            </div>
        </div>

        <!-- Credit -->
        <p class="landing-credit">Created by Evan Saisenesouk & Olivia Ho</p>
    </div>
</body>
</html>
</html>
