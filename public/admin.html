<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ReVamp Admin</title>
    <link rel="icon" type="image/png" href="/img/revamplogo.png">
    <link rel="stylesheet" href="/revamp-style.css">
    <style>
        /* Login Success Popup */
        .login-success-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .login-success-content {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .login-success-icon {
            width: 70px;
            height: 70px;
            background: #22c55e;
            color: white;
            font-size: 36px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .login-success-content h3 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            color: #1a1a1a;
        }
        
        .login-success-content p {
            margin: 0 0 8px;
            color: #444;
            font-size: 1rem;
        }
        
        .login-success-email {
            color: #666 !important;
            font-size: 0.9rem !important;
            margin-bottom: 20px !important;
        }
        
        .login-success-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .login-success-btn:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>
    <!-- Admin auth check happens server-side, but also show user info -->
    <div class="dashboard">
        <aside class="sidebar">
            <a href="/">
                <img src="img/revamp.png" alt="ReVamp Logo" class="logo">
            </a>
            <ul class="sidebar-menu">
                <li class="active">Dashboard</li>
                <li>Orders</li>
                <li class="active-item">Products</li>
                <li id="shop-settings-link">Shop Settings</li>
            </ul>
            <!-- Admin user info -->
            <div class="sidebar-user" id="sidebar-user">
                <!-- Populated by JS -->
            </div>
        </aside>

        <main class="main-area">

            <header class="page-header dashboard-only">
                <h1>PRODUCTS</h1>
                <div class="search-row">
                    <input id="search" placeholder="Search" />
                </div>
                <div class="view-store">
                    <a href="public.html" class="view-store-btn" rel="noopener">View storefront</a>
                </div>
            </header>

            <div class="controls dashboard-only">
                <div class="tabs">
                    <button class="tab active">Products</button>
                    <button class="tab">Collections</button>
                </div>
                <div class="actions">
                    <!-- Remove quick edit button, keep arrange -->
                    <button id="arrangeBtn" class="pill">Arrange shop</button>
                </div>
            </div>

            <!-- Shop Settings Panel (hidden by default) -->
            <div id="shopSettingsPanel" class="shop-settings-panel" style="display: none;">
                <header class="page-header">
                    <div style="display:flex;align-items:center;gap:16px">
                        <button type="button" id="backFromSettings" class="back-link">←</button>
                        <h2>SHOP SETTINGS</h2>
                    </div>
                </header>
                <section class="settings-content">
                    <form id="settingsForm" class="edit-form">
                        <label>Business Title
                            <input id="businessTitle" name="title" type="text" placeholder="Your Business Name">
                        </label>
                        <label>Business Description
                            <textarea id="businessDescription" name="description" placeholder="Describe your business..."></textarea>
                        </label>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                    </form>
                </section>
            </div>

                        <section class="products-grid" id="productsGrid">
                                <!-- Add product card and product cards will be injected here -->
                        </section>

                        <!-- Edit Product SPA Section (hidden by default) -->
                        <div id="editProductSection" class="spa-edit-section" style="display:none;">
                            <header class="page-header edit-header">
                                <div style="display:flex;align-items:center;gap:16px">
                                    <button type="button" id="backToDashboard" class="back-link">←</button>
                                    <h2 id="editProductTitle">ADD PRODUCT</h2>
                                </div>
                                <div class="edit-actions">
                                    <button type="button" id="deleteProductBtn" class="btn btn-ghost" style="display:none;">Delete Product</button>
                                    <button type="button" class="btn btn-primary" id="saveProductBtn">SAVE ITEM</button>
                                </div>
                            </header>
                            <section class="edit-content">
                                <form id="editForm" class="edit-form" enctype="multipart/form-data">
                                    <div class="grid-columns">
                                        <div class="left-column">
                                            <div class="top-block">
                                                <label>Product Name
                                                    <input id="title" name="title" type="text" placeholder="Title">
                                                </label>
                                                <label>Product Description
                                                    <textarea id="description" name="description" placeholder="Insert text ..."></textarea>
                                                </label>
                                            </div>
                                            <div class="variation-section">
                                                <div class="variation-header-row">
                                                    <div class="variation-title">Variation(s)</div>
                                                </div>

                                                <div id="variationsContainer"></div>

                                                <div class="variation-add-row">
                                                    <input id="newVariationName" class="variation-input" type="text" placeholder="Variation type">
                                                    <button type="button" id="addVariationTypeBtn" class="btn-add-variation">Add</button>
                                                </div>
                                            </div>
                                            <br>
                                            <label>Price
                                                <div class="input-inline">
                                                    <input id="price" name="price" type="text" placeholder="$0.00" aria-label="price amount">
                                                    <select id="currency" name="currency" class="currency-select" aria-label="currency">
                                                        <option value="CAD">CAD $</option>
                                                        <option value="USD">USD $</option>
                                                        <option value="EUR">EUR €</option>
                                                        <option value="GBP">GBP £</option>
                                                    </select>
                                                </div>
                                            </label>
                                            <label>Shipping
                                                <div class="input-inline">
                                                    <input id="shipping" name="shipping" type="text" placeholder="$0.00" aria-label="shipping amount">
                                                    <select id="shippingType" name="shippingType" class="shipping-select" aria-label="shipping type">
                                                        <option value="domestic">Domestic</option>
                                                        <option value="international">International</option>
                                                        <option value="custom">Custom</option>
                                                    </select>
                                                </div>
                                            </label>
                                        </div>
                                        <aside class="right-column">
                                            <label>Upload Image(s)</label>
                                            <div class="upload-large">
                                                <!-- keep native file input but hide it; preserve name for form submission -->
                                                <input id="images" name="images" type="file" accept="image/*" multiple style="display:none;" />
                                                <div class="upload-dropzone" role="button" tabindex="0">
                                                    <div class="upload-icon-circle">⤴︎</div>
                                                    <div class="upload-title">Click to choose an image or drag here</div>
                                                    <div class="upload-sub">Accepted file types: gif, png, jpg, webp</div>
                                                    <div class="upload-sub">Size limit: 10 MB</div>
                                                </div>
                                            </div>
                                            <label>Status
                                                <select id="status" name="status">
                                                    <option value="active">Active</option>
                                                    <option value="hidden">Hidden</option>
                                                    <option value="soldout">Sold Out</option>
                                                    <option value="preorder">Preorder Now</option>
                                                </select>
                                            </label>
                                        </aside>
                                    </div>
                                </form>
                            </section>
                        </div>
        </main>
    </div>

    <template id="product-template">
        <div class="product-card">
            <div class="thumb">
                <div class="placeholder">Image</div>
                <input class="select" type="checkbox" />
            </div>
            <div class="meta">
                <div class="title">Product Title</div>
                <div class="price">$0.00</div>
            </div>
        </div>
    </template>

    <template id="variation-group-template">
        <div class="variation-group">
            <div class="variation-header">
                <input class="variation-name" type="text" value="Variation" />
                <button type="button" class="remove-variation">Remove</button>
            </div>
            <div class="input-inline">
                <input class="variation-tag-input" type="text" placeholder="Add tag" />
                <button class="add-variation-tag selector" type="button">Add</button>
            </div>
            <div class="chip-list variation-tags"></div>
        </div>
    </template>

    <script src="revamp-script.js"></script>
    <script>
        // Login success popup function
        function showLoginSuccess(user) {
            const popup = document.createElement('div');
            popup.className = 'login-success-popup';
            popup.innerHTML = `
                <div class="login-success-content">
                    <div class="login-success-icon">✓</div>
                    <h3>Login Successful!</h3>
                    <p>Welcome back, <strong>${user.name || user.email}</strong></p>
                    <p class="login-success-email">${user.email}</p>
                    <button class="login-success-btn" onclick="this.parentElement.parentElement.remove()">Continue to Dashboard</button>
                </div>
            `;
            document.body.appendChild(popup);
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.style.opacity = '0';
                    setTimeout(() => popup.remove(), 300);
                }
            }, 5000);
        }

        // Admin-specific initialization
        document.addEventListener('DOMContentLoaded', async function() {
            // Load user info for sidebar
            try {
                const response = await fetch('/api/user');
                const user = await response.json();
                
                // If not admin (shouldn't happen due to server protection, but just in case)
                if (!user.isAdmin) {
                    window.location.href = '/';
                    return;
                }
                
                // Show login success popup if this is a fresh login (via referrer check)
                const referrer = document.referrer;
                const isFromAuth0 = referrer.includes('auth0.com') || referrer.includes('/callback');
                const hasShownWelcome = sessionStorage.getItem('welcomeShown');
                
                if ((isFromAuth0 || !hasShownWelcome) && user.isAuthenticated) {
                    sessionStorage.setItem('welcomeShown', 'true');
                    showLoginSuccess(user);
                }
                
                const sidebarUser = document.getElementById('sidebar-user');
                sidebarUser.innerHTML = `
                    <div class="admin-profile">
                        <img src="${user.picture || '/img/default-avatar.png'}" 
                             alt="${user.name}" 
                             class="admin-avatar"
                             onerror="this.src='/img/default-avatar.svg'">
                        <div class="admin-info">
                            <span class="admin-name">${user.name || 'Admin'}</span>
                            <span class="admin-role">Administrator</span>
                        </div>
                    </div>
                    <a href="/logout" class="sidebar-logout">Logout</a>
                `;
                
                // Load current business settings
                const businessRes = await fetch('/api/business');
                const business = await businessRes.json();
                document.getElementById('businessTitle').value = business.title || '';
                document.getElementById('businessDescription').value = business.description || '';
                
            } catch (err) {
                console.error('Failed to load admin data:', err);
            }
            
            // Shop Settings panel toggle
            const shopSettingsLink = document.getElementById('shop-settings-link');
            const shopSettingsPanel = document.getElementById('shopSettingsPanel');
            const productsGrid = document.getElementById('productsGrid');
            const dashboardOnly = document.querySelectorAll('.dashboard-only');
            const backFromSettings = document.getElementById('backFromSettings');
            
            shopSettingsLink.addEventListener('click', () => {
                shopSettingsPanel.style.display = 'block';
                productsGrid.style.display = 'none';
                dashboardOnly.forEach(el => el.style.display = 'none');
            });
            
            backFromSettings.addEventListener('click', () => {
                shopSettingsPanel.style.display = 'none';
                productsGrid.style.display = 'grid';
                dashboardOnly.forEach(el => el.style.display = '');
            });
            
            // Settings form submission
            document.getElementById('settingsForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('businessTitle').value;
                const description = document.getElementById('businessDescription').value;
                
                try {
                    const response = await fetch('/api/business', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, description })
                    });
                    
                    if (response.ok) {
                        alert('Settings saved successfully!');
                    } else {
                        const err = await response.json();
                        alert('Failed to save: ' + (err.error || 'Unknown error'));
                    }
                } catch (err) {
                    alert('Failed to save settings');
                    console.error(err);
                }
            });
        });
    </script>
</body>
</html>
